services:
  - type: web
    name: inventory-management-system
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn ims_project.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "True"
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "4"
